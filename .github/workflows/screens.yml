name: UI screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/fetch_fonts.sh
      - run: ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: false
          script: adb install -r app/build/outputs/apk/release/app-release.apk && ./scripts/screens.sh
      - name: Publish screenshots
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/s && cp -r screens /tmp/s/ 2>/dev/null || true
          git checkout --orphan ci-screens
          git rm -rfq --cached . >/dev/null
          rm -rf screens && cp -r /tmp/s/screens . 2>/dev/null || mkdir screens
          git add -f screens
          git commit -qm "screens ${{ github.run_number }}"
          git push -f origin ci-screens
