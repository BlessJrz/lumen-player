name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch fonts
        run: ./scripts/fetch_fonts.sh
      - name: Build
        run: (./scripts/build_qjs.sh && ./gradlew --no-daemon assembleRelease) 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -400 > errors.txt || true
          tail -150 build.log >> errors.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          git add -f errors.txt
          git commit -qm "build ${{ github.run_number }} errors"
          git push -f origin ci-logs
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Lumen-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-APK
          path: Lumen-*.apk
      - name: Publish rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lumen-${{ github.run_number }}.apk --title "Lumen build ${{ github.run_number }}" --notes "Install this APK on your Fold7. Built from ${{ github.sha }}." --prerelease
permissions:
  contents: write
